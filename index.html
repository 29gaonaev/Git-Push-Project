<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <title>Pocket Planet</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172a35;
      --muted: #64747a;
      --paper: #f5f2e9;
      --panel: #fffdf7;
      --line: #d9dfd4;
      --green: #287a60;
      --green-dark: #1d5e49;
      --lime: #d5ed78;
      --coral: #f0785f;
      --blue: #4887a3;
      --gold: #f4c84f;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#c8d5c5 0.8px, transparent 0.8px);
      background-size: 19px 19px;
    }

    button { font: inherit; }

    .shell {
      width: min(100% - 36px, 920px);
      margin: 0 auto;
      padding: 30px 0 36px;
    }

    .topbar, .brand, .wallet, .score-line, .upgrade-top, .upgrade-bottom, .mode-switch {
      display: flex;
      align-items: center;
    }

    .topbar { justify-content: space-between; margin-bottom: 24px; }
    .brand { gap: 11px; }
    .mode-switch {
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      box-shadow: inset 0 0 0 1px rgba(23, 42, 53, 0.02);
    }
    .mode-option {
      padding: 7px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.02em;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease;
    }
    .mode-option.is-active {
      background: var(--green);
      color: white;
      box-shadow: 0 2px 0 var(--green-dark);
    }
    .mode-option:hover:not(.is-active) { background: #edf2e8; color: var(--ink); }
    .mode-option:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .brand-mark {
      display: grid;
      width: 39px;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--lime);
      font-size: 20px;
      transform: rotate(-12deg);
    }
    .brand-name { font-size: 18px; font-weight: 900; letter-spacing: 0; }
    .brand-kicker { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .wallet {
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      font-size: 13px;
      font-weight: 800;
    }
    .wallet-icon { color: #bb8911; font-size: 17px; }

    main { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr); gap: 18px; }
    .play-panel, .shop-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 4px 0 #dfe2d7;
    }
    .play-panel { position: relative; display: flex; min-height: 510px; flex-direction: column; align-items: center; padding: 31px 22px 25px; overflow: hidden; }
    .play-panel::before, .play-panel::after { position: absolute; z-index: 0; color: #dce8cf; font-size: 22px; content: "✦"; }
    .play-panel::before { top: 95px; left: 12%; }
    .play-panel::after { top: 151px; right: 12%; font-size: 15px; }
    .eyebrow { position: relative; z-index: 1; color: var(--green); font-size: 11px; font-weight: 900; letter-spacing: 1.3px; text-transform: uppercase; }
    .score { position: relative; z-index: 1; margin-top: 9px; font-size: clamp(36px, 6vw, 50px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .score-line { position: relative; z-index: 1; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 13px; }
    .planet-button {
      position: relative;
      display: grid;
      width: min(270px, 68vw);
      aspect-ratio: 1;
      flex: 0 0 auto;
      place-items: center;
      margin: auto 0 18px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .planet-button:focus-visible { outline: 4px solid var(--blue); outline-offset: 5px; }
    .planet {
      position: relative;
      display: grid;
      width: 78%;
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #83cbb0;
      box-shadow: inset -16px -14px 0 #56a987, 0 11px 0 var(--green-dark), 0 17px 22px #244e3c2b;
      transition: transform 110ms ease, box-shadow 110ms ease;
    }
    .planet-button:hover .planet { transform: translateY(-3px) rotate(-2deg); }
    .planet-button:active .planet { transform: translateY(7px) scale(.97); box-shadow: inset -16px -14px 0 #56a987, 0 3px 0 var(--green-dark), 0 7px 11px #244e3c24; }
    .planet::before, .planet::after { position: absolute; width: 52px; height: 22px; border-radius: 50%; background: #d5ed78; content: ""; transform: rotate(-25deg); }
    .planet::before { top: 26%; left: 15%; }
    .planet::after { right: 10%; bottom: 24%; width: 39px; height: 16px; }
    .planet-ring { position: absolute; z-index: 1; width: 105%; height: 32%; border: 9px solid #e3ac48; border-radius: 50%; transform: rotate(-24deg); box-shadow: 0 2px 0 #172a35; }
    .planet-face { position: relative; z-index: 2; margin-top: 6px; color: var(--ink); font-size: 49px; letter-spacing: 8px; transform: rotate(-4deg); }
    .planet-face::before { content: "•  •"; }
    .planet-mouth { position: absolute; z-index: 2; top: 55%; left: 50%; width: 14px; height: 8px; border-bottom: 3px solid var(--ink); border-radius: 50%; transform: translateX(-50%); }
    .tap-hint { position: relative; z-index: 1; color: var(--muted); font-size: 12px; }
    .float-text { position: absolute; z-index: 4; color: var(--green-dark); font-size: 20px; font-weight: 900; pointer-events: none; animation: float-up 700ms ease-out forwards; }
    @keyframes float-up { from { opacity: 1; transform: translate(-50%, 0) scale(.8); } to { opacity: 0; transform: translate(-50%, -68px) scale(1.15); } }

    .shop-panel { padding: 23px 20px 17px; }
    .shop-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 17px; }
    h1 { margin: 0; font-size: 23px; font-weight: 900; }
    .shop-subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .shop-count { color: var(--muted); font-size: 11px; font-weight: 700; }
    .upgrade-list { display: grid; gap: 10px; }
    .upgrade {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      transition: border-color 140ms ease, background 140ms ease;
    }
    .upgrade-top { gap: 11px; align-items: flex-start; }
    .upgrade-icon { display: grid; width: 38px; aspect-ratio: 1; flex: 0 0 auto; place-items: center; border-radius: 7px; background: #e5f2de; font-size: 19px; }
    .upgrade:nth-child(2) .upgrade-icon { background: #fbe5d9; }
    .upgrade:nth-child(3) .upgrade-icon { background: #e2edf2; }
    .upgrade:nth-child(4) .upgrade-icon { background: #f8edc8; }
    .upgrade-info { min-width: 0; flex: 1; }
    .upgrade-name { font-size: 13px; font-weight: 900; }
    .upgrade-desc { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .upgrade-bottom { justify-content: space-between; gap: 8px; margin-top: 12px; padding-left: 49px; }
    .upgrade-level { color: var(--muted); font-size: 10px; font-weight: 800; }
    .buy-button { display: flex; min-height: 32px; align-items: center; gap: 5px; padding: 0 10px; border: 0; border-radius: 5px; background: var(--green); color: white; cursor: pointer; font-size: 11px; font-weight: 900; transition: background 140ms ease, transform 140ms ease; }
    .buy-button:hover:not(:disabled) { background: var(--green-dark); transform: translateY(-1px); }
    .buy-button:focus-visible, .reset-button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .buy-button:disabled { background: #e8ece7; color: #8a9691; cursor: not-allowed; }
    .cost-coin { color: var(--gold); }
    .shop-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 17px; padding-top: 12px; border-top: 1px solid var(--line); }
    .production { color: var(--muted); font-size: 11px; }
    .production strong { color: var(--ink); }
    .reset-button { padding: 5px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; text-decoration: underline; text-underline-offset: 2px; }
    .reset-button:hover { color: var(--coral); }
    .save-note { margin-top: 12px; color: #84918c; font-size: 10px; text-align: center; }

    .boss-panel[hidden] { display: none; }
    .boss-panel {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 0.72fr);
      gap: 20px;
      align-items: center;
      padding: 22px;
      border: 2px solid #b74936;
      border-radius: 8px;
      background: #fff2e8;
      box-shadow: 0 4px 0 #e8c8b9;
    }
    .boss-kicker { margin: 0 0 7px; color: #a43c2d; font-size: 11px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase; }
    .boss-heading { margin: 0; font-size: 24px; font-weight: 900; }
    .boss-description, .boss-status { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .boss-description { margin: 7px 0 0; }
    .boss-status { min-height: 18px; margin: 11px 0 0; }
    .boss-visual { display: grid; width: 100%; min-height: 164px; place-items: center; border: 1px solid #e7c2ac; border-radius: 7px; background: #f9dfcd; }
    .boss-icon { color: #993f31; font-size: 76px; line-height: 1; filter: drop-shadow(0 5px 0 #dbab8e); }
    .boss-meter { margin-top: 15px; }
    .boss-health-label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; color: #8c5141; font-size: 10px; font-weight: 900; }
    .boss-health { height: 12px; overflow: hidden; border: 1px solid #9d4938; border-radius: 999px; background: #f4c9b3; }
    .boss-health-fill { width: 100%; height: 100%; border-radius: inherit; background: var(--coral); transition: width 180ms ease; }
    .boss-button { min-height: 39px; padding: 0 15px; border: 0; border-radius: 5px; background: #a43c2d; color: white; cursor: pointer; font-size: 12px; font-weight: 900; }
    .boss-button:hover { background: #812e24; }
    .boss-button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    @media (max-width: 700px) {
      .shell { width: min(100% - 24px, 500px); padding-top: 18px; }
      .topbar { margin-bottom: 15px; }
      main { grid-template-columns: 1fr; gap: 13px; }
      .play-panel { min-height: 415px; padding-top: 22px; }
      .planet-button { width: min(235px, 61vw); margin-top: 22px; }
      .planet-face { font-size: 43px; }
      .shop-panel { padding: 19px 15px 15px; }
      .upgrade-list { grid-template-columns: 1fr 1fr; }
      .upgrade { padding: 11px; }
      .upgrade-top { gap: 8px; }
      .upgrade-icon { width: 32px; }
      .upgrade-bottom { padding-left: 40px; }
      .upgrade-desc { min-height: 30px; }
      .boss-panel { grid-template-columns: 1fr; gap: 14px; padding: 16px; }
      .boss-visual { min-height: 120px; }
      .boss-icon { font-size: 62px; }
    }

    @media (max-width: 380px) {
      .upgrade-list { grid-template-columns: 1fr; }
      .upgrade-desc { min-height: 0; }
      .play-panel { min-height: 385px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Pocket Planet">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <div class="brand-name">POCKET PLANET</div>
          <div class="brand-kicker">a tiny world, all yours</div>
        </div>
      </div>
      <div class="mode-switch" aria-label="Select game mode">
        <button class="mode-option is-active" type="button" data-mode="story">Story mode</button>
        <button class="mode-option" type="button" data-mode="classic">Classic</button>
      </div>
      <div class="wallet" aria-label="Stardust balance"><span class="wallet-icon" aria-hidden="true">✦</span><span id="wallet-count">0</span><span>stardust</span></div>
    </header>

    <main>
      <section class="play-panel" aria-label="Planet">
        <div class="eyebrow">Your little corner of the cosmos</div>
        <div class="score" id="score" aria-live="polite">0</div>
        <div class="score-line"><span aria-hidden="true">✦</span> stardust collected</div>
        <button class="planet-button" id="planet-button" type="button" aria-label="Tap the planet to collect stardust">
          <span class="planet" aria-hidden="true"><span class="planet-ring"></span><span class="planet-face"></span><span class="planet-mouth"></span></span>
        </button>
        <div class="tap-hint">Tap your planet to gather stardust</div>
      </section>

      <section class="shop-panel" aria-labelledby="shop-title">
        <div class="shop-heading">
          <div><h1 id="shop-title">Little upgrades</h1><div class="shop-subtitle">Make your planet work for you.</div></div>
          <div class="shop-count" id="shop-count">0 owned</div>
        </div>
        <div class="upgrade-list" id="upgrade-list"></div>
        <div class="shop-footer">
          <div class="production">Per second <strong id="per-second">0</strong></div>
          <button class="reset-button" id="reset-button" type="button">Start over</button>
        </div>
        <div class="save-note">Your planet saves automatically on this device.</div>
      </section>

      <section class="boss-panel" id="boss-panel" aria-labelledby="boss-name" hidden>
        <div>
          <p class="boss-kicker">A secret rift has opened</p>
          <h2 class="boss-heading" id="boss-name"></h2>
          <p class="boss-description" id="boss-description"></p>
          <div class="boss-meter" id="boss-meter">
            <div class="boss-health-label"><span>VITALITY</span><span id="boss-health-text"></span></div>
            <div class="boss-health" id="boss-health" role="progressbar" aria-label="Boss health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div class="boss-health-fill" id="boss-health-fill"></div>
            </div>
          </div>
          <p class="boss-status" id="boss-status" aria-live="polite"></p>
          <button class="boss-button" id="boss-button" type="button"></button>
        </div>
        <div class="boss-visual" aria-hidden="true"><span class="boss-icon" id="boss-icon"></span></div>
      </section>
    </main>
  </div>

  <script>
    const upgrades = [
      { id: "gloves", name: "Comfy gloves", description: "+1 stardust per tap", icon: "✋", baseCost: 15, tapBonus: 1, rate: 0 },
      { id: "satellite", name: "Pocket satellite", description: "+1 stardust every second", icon: "🛰️", baseCost: 40, tapBonus: 0, rate: 1 },
      { id: "greenhouse", name: "Moon greenhouse", description: "+5 stardust every second", icon: "🌱", baseCost: 125, tapBonus: 0, rate: 5 },
      { id: "comet", name: "Comet catcher", description: "+3 stardust per tap", icon: "☄️", baseCost: 90, tapBonus: 3, rate: 0 },
      { id: "star-chart", name: "Star chart", description: "+10 stardust per tap", icon: "🗺️", baseCost: 250, tapBonus: 10, rate: 0 },
      { id: "asteroid-drill", name: "Asteroid drill", description: "+15 stardust every second", icon: "⛏️", baseCost: 450, tapBonus: 0, rate: 15 },
      { id: "nova-net", name: "Nova net", description: "+30 stardust per tap", icon: "🕸️", baseCost: 850, tapBonus: 30, rate: 0 },
      { id: "observatory", name: "Sky observatory", description: "+50 stardust every second", icon: "🔭", baseCost: 1250, tapBonus: 0, rate: 50 },
      { id: "star-engine", name: "Star engine", description: "+150 stardust every second", icon: "⚙️", baseCost: 3200, tapBonus: 0, rate: 150 }
    ];
    const bosses = [
      { name: "The Dust Wyrm", description: "A hungry shadow curled around the far side of your little world.", icon: "🐉", health: 80, reward: 250 },
      { name: "The Moon Mimic", description: "It borrowed the moon's face. It did not borrow its manners.", icon: "🌚", health: 450, reward: 1500 },
      { name: "The Hollow Star", description: "The oldest light in the sky has started looking back.", icon: "🌟", health: 2400, reward: 8000 },
      { name: "The Star Eater", description: "A cosmic hunger with a star for a heart. This one will take everything your planet has learned.", icon: "🕳️", health: 120000, reward: 250000 }
    ];
    const storageKey = "pocket-planet-save-v1";
    const defaultState = { stardust: 0, totalCollected: 0, owned: {}, bossIndex: 0, bossActive: false, bossHealth: 0, storyMode: true };
    let state = loadState();

    const scoreElement = document.getElementById("score");
    const tapHintElement = document.querySelector(".tap-hint");
    const walletElement = document.getElementById("wallet-count");
    const perSecondElement = document.getElementById("per-second");
    const shopCountElement = document.getElementById("shop-count");
    const upgradeListElement = document.getElementById("upgrade-list");
    const bossPanelElement = document.getElementById("boss-panel");
    const bossNameElement = document.getElementById("boss-name");
    const bossDescriptionElement = document.getElementById("boss-description");
    const bossIconElement = document.getElementById("boss-icon");
    const bossMeterElement = document.getElementById("boss-meter");
    const bossHealthElement = document.getElementById("boss-health");
    const bossHealthFillElement = document.getElementById("boss-health-fill");
    const bossHealthTextElement = document.getElementById("boss-health-text");
    const bossStatusElement = document.getElementById("boss-status");
    const bossButtonElement = document.getElementById("boss-button");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (!saved || typeof saved !== "object") return { ...defaultState };
        const bossIndex = Math.min(bosses.length, Math.max(0, Math.floor(Number(saved.bossIndex) || 0)));
        return {
          stardust: Math.max(0, Number(saved.stardust) || 0),
          totalCollected: Math.max(0, Number(saved.totalCollected) || 0),
          owned: saved.owned && typeof saved.owned === "object" ? saved.owned : {},
          bossIndex,
          bossActive: saved.bossActive === true && bossIndex < bosses.length,
          bossHealth: Math.max(0, Number(saved.bossHealth) || 0),
          storyMode: saved.storyMode !== false
        };
      } catch {
        return { ...defaultState };
      }
    }

    function formatNumber(value) {
      return Math.floor(value).toLocaleString();
    }

    function ownedCount(upgrade) {
      return Math.max(0, Math.floor(Number(state.owned[upgrade.id]) || 0));
    }

    function costFor(upgrade) {
      return Math.ceil(upgrade.baseCost * Math.pow(1.16, ownedCount(upgrade)));
    }

    function tapPower() {
      return 1 + upgrades.reduce((sum, upgrade) => sum + ownedCount(upgrade) * upgrade.tapBonus, 0);
    }

    function productionRate() {
      return upgrades.reduce((sum, upgrade) => sum + ownedCount(upgrade) * upgrade.rate, 0);
    }

    function saveState() {
      try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch { /* Storage can be unavailable in private browsing. */ }
    }

    function render() {
      scoreElement.textContent = formatNumber(state.stardust);
      walletElement.textContent = formatNumber(state.stardust);
      perSecondElement.textContent = formatNumber(productionRate());
      tapHintElement.textContent = state.storyMode
        ? "Story mode: follow the cosmic trail and defeat each challenger"
        : "Tap your planet to gather stardust";
      document.querySelectorAll(".mode-option").forEach((button) => {
        const isActive = button.dataset.mode === (state.storyMode ? "story" : "classic");
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
      const totalOwned = upgrades.reduce((sum, upgrade) => sum + ownedCount(upgrade), 0);
      shopCountElement.textContent = `${totalOwned} owned`;
      upgradeListElement.replaceChildren();

      for (const upgrade of upgrades) {
        const count = ownedCount(upgrade);
        const cost = costFor(upgrade);
        const card = document.createElement("div");
        card.className = "upgrade";
        card.innerHTML = `<div class="upgrade-top"><div class="upgrade-icon" aria-hidden="true">${upgrade.icon}</div><div class="upgrade-info"><div class="upgrade-name">${upgrade.name}</div><div class="upgrade-desc">${upgrade.description}</div></div></div><div class="upgrade-bottom"><span class="upgrade-level">Owned: ${count}</span><button class="buy-button" type="button" ${state.stardust < cost ? "disabled" : ""} aria-label="Buy ${upgrade.name} for ${formatNumber(cost)} stardust"><span class="cost-coin" aria-hidden="true">✦</span>${formatNumber(cost)}</button></div>`;
        card.querySelector("button").addEventListener("click", () => buyUpgrade(upgrade));
        upgradeListElement.append(card);
      }
      renderBoss();
    }

    function bossDamage() {
      return Math.max(1, tapPower() + Math.floor(productionRate() / 10));
    }

    function storyThreshold() {
      return state.storyMode ? 50 : 500;
    }

    function renderBoss() {
      const revealed = state.totalCollected >= storyThreshold() || state.bossIndex > 0;
      bossPanelElement.hidden = !revealed;
      if (!revealed) return;

      if (state.bossIndex >= bosses.length) {
        bossNameElement.textContent = "The rift is quiet";
        bossDescriptionElement.textContent = "Every hidden challenger has been defeated. Your corner of the cosmos is safe... for now.";
        bossIconElement.textContent = "✦";
        bossMeterElement.hidden = true;
        bossStatusElement.textContent = "All secret bosses defeated.";
        bossButtonElement.hidden = true;
        return;
      }

      const boss = bosses[state.bossIndex];
      const health = state.bossActive ? Math.min(boss.health, state.bossHealth) : boss.health;
      const healthPercent = Math.max(0, (health / boss.health) * 100);
      bossNameElement.textContent = boss.name;
      bossDescriptionElement.textContent = boss.description;
      bossIconElement.textContent = boss.icon;
      bossMeterElement.hidden = false;
      bossHealthTextElement.textContent = `${formatNumber(health)} / ${formatNumber(boss.health)}`;
      bossHealthElement.setAttribute("aria-valuemax", String(boss.health));
      bossHealthElement.setAttribute("aria-valuenow", String(health));
      bossHealthFillElement.style.width = `${healthPercent}%`;
      bossStatusElement.textContent = state.bossActive
        ? `Chapter ${state.bossIndex + 1}: each attack deals ${formatNumber(bossDamage())} damage. Defeat it for ${formatNumber(boss.reward)} stardust.`
        : state.storyMode
          ? `Chapter ${state.bossIndex + 1} begins here. A challenger waits beyond the rift. Victory earns ${formatNumber(boss.reward)} stardust.`
          : `A challenger waits beyond the rift. Victory earns ${formatNumber(boss.reward)} stardust.`;
      bossButtonElement.hidden = false;
      bossButtonElement.textContent = state.bossActive ? "Attack boss" : "Challenge boss";
    }

    function collect(amount, x, y) {
      state.stardust += amount;
      state.totalCollected += amount;
      saveState();
      render();
      if (x !== undefined && y !== undefined) showFloat(amount, x, y);
    }

    function showFloat(amount, x, y) {
      const float = document.createElement("span");
      float.className = "float-text";
      float.textContent = `+${formatNumber(amount)} ✦`;
      float.style.left = `${x}px`;
      float.style.top = `${y}px`;
      document.querySelector(".play-panel").append(float);
      float.addEventListener("animationend", () => float.remove(), { once: true });
    }

    function buyUpgrade(upgrade) {
      const cost = costFor(upgrade);
      if (state.stardust < cost) return;
      state.stardust -= cost;
      state.owned[upgrade.id] = ownedCount(upgrade) + 1;
      saveState();
      render();
    }

    function fightBoss() {
      if (state.bossIndex >= bosses.length) return;
      const boss = bosses[state.bossIndex];
      if (!state.bossActive) {
        state.bossActive = true;
        state.bossHealth = boss.health;
      } else {
        state.bossHealth -= bossDamage();
        if (state.bossHealth <= 0) {
          state.stardust += boss.reward;
          state.totalCollected += boss.reward;
          state.bossIndex += 1;
          state.bossActive = false;
          state.bossHealth = 0;
        }
      }
      saveState();
      render();
    }

    document.getElementById("planet-button").addEventListener("click", (event) => {
      const bounds = document.querySelector(".play-panel").getBoundingClientRect();
      collect(tapPower(), event.clientX - bounds.left, event.clientY - bounds.top);
    });

    document.querySelectorAll(".mode-option").forEach((button) => {
      button.addEventListener("click", () => {
        state.storyMode = button.dataset.mode === "story";
        saveState();
        render();
      });
    });

    document.getElementById("reset-button").addEventListener("click", () => {
      if (!window.confirm("Start over and reset your planet?")) return;
      state = { ...defaultState, owned: {}, storyMode: state.storyMode };
      saveState();
      render();
    });

    bossButtonElement.addEventListener("click", fightBoss);

    setInterval(() => {
      const rate = productionRate();
      if (!rate) return;
      state.stardust += rate;
      state.totalCollected += rate;
      saveState();
      render();
    }, 1000);

    render();
  </script>
</body>
</html>
